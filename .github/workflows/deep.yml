# Deep lane: dev -> main. Same checks plus stricter shell linting and an
# inventory, since this repo's whole value is that a stranger can follow it.
name: deep

on:
  pull_request:
    branches: [main]

concurrency:
  group: deep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: setup.sh + patches (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: setup.sh parses
        run: bash -n setup.sh

      - name: Install pinned ShellCheck
        # ubuntu-latest's shellcheck floats, and a newer build flagged SC2015
        # that local 0.11.0 did not report at any severity. Pinning keeps a
        # local run and this job in agreement.
        run: |
          VER=v0.11.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/$VER/shellcheck-$VER.linux.x86_64.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local/bin "shellcheck-$VER/shellcheck"
          shellcheck --version | grep version

      - name: Install pinned ShellCheck
        # ubuntu-latest's shellcheck floats, and a newer build flagged SC2015
        # that local 0.11.0 did not report at any severity. Pinning keeps a
        # local run and this job in agreement.
        run: |
          VER=v0.11.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/$VER/shellcheck-$VER.linux.x86_64.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local/bin "shellcheck-$VER/shellcheck"
          shellcheck --version | grep version

      - name: ShellCheck including style
        run: shellcheck --severity=style setup.sh

      - name: Python helpers compile
        run: python3 -m py_compile benchmark.py test_blender.py

      - name: Patches are well-formed
        run: python3 tools/check_patches.py --verbose
